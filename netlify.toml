# Netlify builds the site from source on every push to main.
# build.py pulls live content from the SunRiver Sanity CMS and writes the site to /dist.
[build]
  command = "python3 build.py"
  publish = "dist"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Same-origin path to the Sanity image CDN, so the header can read a hero photo's colors (logo contrast)
[[redirects]]
  from = "/cdn-img/*"
  to = "https://cdn.sanity.io/images/ib6s13lu/production/:splat"
  status = 200

# Same-origin path to the photos still hosted on the earlier Vercel build (same reason as above)
[[redirects]]
  from = "/vimg/*"
  to = "https://sunriver-website.vercel.app/_next/static/media/:splat"
  status = 200
